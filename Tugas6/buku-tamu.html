<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Buku Tamu Digital</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="card">
        <div class="header-section">
          <h1>Buku Tamu Digital</h1>
          <p class="subtitle">
            Silakan isi formulir di bawah ini untuk mencatat kehadiran atau
            keperluan Anda.
          </p>
        </div>

        <form onsubmit="kirimBukuTamu(event)">
          <div class="form-group">
            <label for="nama">Nama Lengkap</label>
            <input
              type="text"
              id="nama"
              name="nama"
              placeholder="Masukkan nama lengkap"
              required
            />
          </div>

          <div class="form-group">
            <label for="kontak">Nomor WhatsApp / Email</label>
            <input
              type="text"
              id="kontak"
              name="kontak"
              placeholder="Contoh: 08123456789 atau email@domain.com"
              required
            />
          </div>

          <div class="form-group">
            <label for="kategori">Kategori Pengunjung</label>
            <select id="kategori" name="kategori" required>
              <option value="" disabled selected>-- Pilih Kategori --</option>
              <option value="umum">Umum / Personal</option>
              <option value="klien">Klien / Pelanggan</option>
              <option value="mitra">Mitra Kerja / Vendor</option>
              <option value="instansi">Instansi / Lembaga</option>
            </select>
          </div>

          <div class="form-group">
            <label for="keperluan">Keperluan Kunjungan</label>
            <input
              type="text"
              id="keperluan"
              name="keperluan"
              placeholder="Contoh: Pemesanan produk, konsultasi, kunjungan umum"
              required
            />
          </div>

          <div class="form-group">
            <label for="pesan">Pesan / Saran / Catatan</label>
            <textarea
              id="pesan"
              name="pesan"
              rows="4"
              placeholder="Tuliskan pesan atau catatan tambahan di sini..."
            ></textarea>
          </div>

          <button type="submit" class="btn-submit">Simpan Kehadiran</button>

          <div class="link-back">
            <a href="home.html">&larr; Kembali ke Halaman Utama</a>
          </div>
        </form>
      </div>
    </div>

    <script>
      function kirimBukuTamu(event) {
        event.preventDefault();
        alert("Terima kasih! Kehadiran dan pesan Anda telah berhasil dicatat.");
        event.target.reset();
      }
    </script>
  </body>
</html>
